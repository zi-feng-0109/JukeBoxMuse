pluginManagement {
    repositories {
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'jukeboxmuse'

// core: plain Java (platform clients, settings, lyrics, data types)
// common: vanilla Minecraft code shared by the loaders
// neoforge: the NeoForge mod
include 'core'
include 'common'
include 'neoforge'
