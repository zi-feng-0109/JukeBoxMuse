pluginManagement {
    repositories {
        gradlePluginPortal()
        // Fabric Loom
        exclusiveContent {
            forRepository {
                maven {
                    name = 'Fabric'
                    url = uri('https://maven.fabricmc.net')
                }
            }
            filter {
                includeGroupAndSubgroups('net.fabricmc')
                includeGroup('fabric-loom')
            }
        }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'jukeboxmuse'

// core: plain Java (platform clients, settings, lyrics, data types)
// common: vanilla Minecraft code shared by the loaders
// neoforge, fabric: the mod for each loader
include 'core'
include 'common'
include 'neoforge'
include 'fabric'
