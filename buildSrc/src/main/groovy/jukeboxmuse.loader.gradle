// A mod loader project (neoforge, fabric). It compiles core's and common's sources together with its own, so its
// jar is the complete mod and every class lives in one module (as in the MultiLoader template).
plugins {
    id 'jukeboxmuse.java'
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

configurations {
    sharedJavaSources {
        canBeResolved = true
        canBeConsumed = false
    }
    sharedResourceSources {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    // For the IDE; the sources themselves are compiled below
    compileOnly project(':core')
    compileOnly project(':common')
    sharedJavaSources project(path: ':core', configuration: 'sharedJava')
    sharedJavaSources project(path: ':common', configuration: 'sharedJava')
    sharedResourceSources project(path: ':common', configuration: 'sharedResources')
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.sharedJavaSources)
    source(configurations.sharedJavaSources)
}

tasks.named('processResources', ProcessResources) {
    dependsOn(configurations.sharedResourceSources)
    from(configurations.sharedResourceSources)
}

// Ship the license and third-party notices inside the mod jar
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE'))
    from(rootProject.file('THIRD_PARTY_NOTICES.md'))
}
