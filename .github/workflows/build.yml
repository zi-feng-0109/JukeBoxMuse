# Builds both loaders and runs the tests on every push and pull request; the jars are kept as a workflow artifact.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit
      - run: chmod +x gradlew

      - run: ./gradlew build

      - uses: actions/upload-artifact@v4
        with:
          name: jukeboxmuse-jars
          path: |
            neoforge/build/libs/*.jar
            fabric/build/libs/*.jar
