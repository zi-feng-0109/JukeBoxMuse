# Builds every node (versions/<minecraft>-<loader>) and runs the core tests on every push and pull request; the jars
# are kept as a workflow artifact.
name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 17 and 21 compile the older Minecraft versions; Gradle itself runs on 25 (the last one, which becomes
      # JAVA_HOME; see gradle/gradle-daemon-jvm.properties)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
            25

      - uses: gradle/actions/setup-gradle@v4

      # gradlew is committed from Windows without the executable bit
      - run: chmod +x gradlew

      # collectJar copies every node's distributable jar into build/libs/<mod version>/
      - run: ./gradlew build collectJar

      - uses: actions/upload-artifact@v4
        with:
          name: jukeboxmuse-jars
          path: build/libs/*/jukeboxmuse-*.jar
