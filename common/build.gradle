// Code shared by the loaders that needs Minecraft: screens, rendering, playback, networking, the song service.
// Compiled here against vanilla Minecraft only (NeoForm, no loader), so it cannot use NeoForge or Fabric APIs.
plugins {
    id 'jukeboxmuse.java'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }
}

dependencies {
    compileOnly project(':core')
    // Bundled by each loader
    compileOnly "com.google.zxing:core:3.5.3"
    compileOnly "javazoom:jlayer:1.0.1"
}
