# Build parameters. Sections tagged with a Minecraft version and/or loader apply only to those nodes
# (see stonecutter.gradle.kts). Gradle's own options stay in gradle.properties.

mod.id = "jukeboxmuse"
mod.name = "Jukebox Muse"
mod.version = "1.0.0"
mod.group = "top.nalanquede.jukeboxmuse"
mod.license = "GPL-3.0-or-later"
mod.authors = "zifeng0109"

# ./gradlew publishMods: project ids from the Modrinth / CurseForge project pages; empty skips that platform.
# Tokens go in the MODRINTH_TOKEN / CURSEFORGE_TOKEN environment variables.
publish.modrinth = "tWM4xkYP"
publish.curseforge = "1738426"

# Bundled into the mod jar: QR codes (login, decoding QQ's PNG) and MP3 decoding
deps.zxing = "3.5.3"
deps.jlayer = "1.0.1"

# Fabric, see https://fabricmc.net/develop/
deps.fabric_loader = "0.19.5"
# The Fabric Loom version is in stonecutter.gradle.kts


["1.21.1"]
# Releases marked compatible on Modrinth / CurseForge
mod.mc_releases = ["1.21.1"]
# Parameter names, see https://parchmentmc.org/docs/getting-started
deps.parchment = "2024.11.17"

[fabric."1.21.1"]
# Minecraft range in fabric.mod.json / neoforge.mods.toml
mod.mc_compat = "1.21.1"
deps.fabric_api = "0.116.17+1.21.1"

[neoforge."1.21.1"]
mod.mc_compat = "[1.21.1]"
deps.neoforge = "21.1.256"


